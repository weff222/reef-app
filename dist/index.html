  --blue-solid: #5b4cda; --blue-hover: #6a5ae8; --on-blue: #fff;
  --incoming: #2d2b3f; --outgoing: #5b4cda; --on-outgoing: #fff; --meta-out: #e9e5ff;
  --ok: #78ca9f; --danger: #f29b9d; --warn: #e9bc82;
  --thumb: #4a4763; --shadow: 0 8px 26px #0b0a1450;
}
:root[data-theme='light'] {
  color-scheme: light;
  --bg: #f4f3fb; --rail: #e6e3f5; --sidebar: #eeecf8; --surface: #f7f6fc;
  --field: #e9e7f5; --hover: #e4e1f2; --selected: #dcd8f5; --raised: #fff;
  --line: #dedbee; --line-strong: #c8c4e0;
  --text: #1d1a2e; --soft: #37324d; --muted: #5b5578; --quiet: #6b6588;
  --accent-ink: #4a3bc9; --accent-bg: #e4e1fb; --accent-line: #c6c0f2;
  --incoming: #e9e7f2; --outgoing: #5b4cda; --meta-out: #ece8ff;
  --ok: #25845c; --danger: #a92838; --warn: #88561f;
  --thumb: #c3bfda; --shadow: 0 8px 26px #2a255825;
}
:root[data-scale='compact'] { --body-size: 12px; --small-size: 11px; --row-h: 56px; --message-size: 12.5px; --head-h: 59px; }
:root[data-scale='large'] { --body-size: 14.5px; --small-size: 12.5px; --row-h: 69px; --message-size: 15px; --head-h: 68px; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; }
body { background: var(--bg); color: var(--text); font: var(--body-size)/1.45 var(--font); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button, input, textarea { -webkit-tap-highlight-color: transparent; }
button { border: 0; background: none; padding: 0; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
a { color: var(--accent-ink); }
svg { display: block; flex: none; }
h1, h2, h3, p { margin: 0; }
::placeholder { color: var(--quiet); opacity: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: #6a5ae8; color: white; }
.scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--thumb) transparent; min-height: 0; overscroll-behavior: contain; }
.ellipsis { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; white-space: nowrap; clip-path: inset(50%); border: 0; }
.app { display: grid; grid-template-columns: var(--rail-w) var(--sidebar-w) minmax(0, 1fr); height: 100vh; height: 100dvh; min-width: 800px; min-height: 432px; }
.app.rail-expanded { --rail-w: 160px; }
.rail, .sidebar, .workspace { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.rail { background: var(--rail); border-right: 1px solid var(--line); align-items: center; z-index: 8; }
.sidebar { background: var(--sidebar); border-right: 1px solid var(--line); z-index: 4; }
.workspace { background: var(--bg); }
.icon { width: 19px; height: 19px; }
.icon-btn { position: relative; flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; color: var(--muted); }
.icon-btn:hover, .icon-btn[aria-expanded='true'] { background: var(--hover); color: var(--text); }
.icon-btn:active:not(:disabled) { background: var(--selected); }
.icon-btn.is-on { color: var(--accent-ink); background: var(--accent-bg); }
.icon-btn:disabled { opacity: .38; }
.tip { position: relative; }
.tip::after { position: absolute; z-index: 20; display: block; opacity: 0; visibility: hidden; pointer-events: none; content: attr(data-tip); white-space: nowrap; border: 1px solid var(--line-strong); color: var(--text); background: var(--raised); box-shadow: 0 3px 9px #0002; border-radius: 6px; font-size: 11px; font-weight: 500; line-height: 1.25; padding: 6px 8px; bottom: calc(100% + 7px); left: 50%; translate: -50% 0; }
.tip:not(:disabled):not([aria-expanded='true']):is(:hover, :focus-visible)::after, .rail-menu.tip[aria-expanded='true']:is(:hover, :focus-visible)::after { opacity: 1; visibility: visible; transition: opacity .13s .38s, visibility 0s .38s; }
.tip[data-tip-pos='right']::after { bottom: auto; left: calc(100% + 8px); top: 50%; translate: 0 -50%; }
.tip[data-tip-pos='bottom']::after { top: calc(100% + 7px); bottom: auto; }
.tip[data-tip-pos='edge']::after { left: auto; right: 0; translate: 0 0; }
.tip[data-tip-pos='bottom-edge']::after { top: calc(100% + 7px); bottom: auto; left: auto; right: 0; translate: 0 0; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--soft); font-weight: 550; font-size: var(--body-size); line-height: 1.22; text-decoration: none; white-space: nowrap; }
.btn .icon { width: 16px; height: 16px; }
.btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.btn.primary { background: var(--blue-solid); border-color: transparent; color: var(--on-blue); }
.btn.primary:hover:not(:disabled) { background: var(--blue-hover); color: var(--on-blue); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { background: #dc2626 !important; border: 1px solid #b91c1c !important; color: #ffffff !important; font-weight: 600; box-shadow: 0 2px 6px rgba(220, 38, 38, 0.35); }
.btn.danger:hover:not(:disabled) { background: #ef4444 !important; border-color: #dc2626 !important; color: #ffffff !important; }
.btn.danger .icon { color: #ffffff !important; }
.btn:disabled { opacity: .43; }
.kbd { font-size: 10px; border: 1px solid var(--line-strong); border-radius: 4px; font-family: var(--font); color: var(--quiet); display: inline-grid; place-items: center; white-space: nowrap; padding: 0 4px; min-height: 17px; }
.counter { display: inline-flex; align-items: center; justify-content: center; height: 18px; min-width: 18px; padding: 0 5px; border-radius: 999px; color: var(--on-blue); background: var(--blue-solid); font-size: 10px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
.counter.quiet-count { background: var(--field); color: var(--muted); }
.status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
.dot-unread { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }

/* 02 — Rail and shared sidebar */
.rail-top { height: var(--head-h); width: 100%; display: flex; align-items: center; justify-content: center; flex: none; }
.rail-controls, .rail-bottom { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 7px; }
.rail-controls { padding-top: 3px; }
.rail-bottom { margin-top: auto; padding: 0 0 13px; gap: 6px; }
.rail-rule { width: 25px; height: 1px; background: var(--line); margin: 0 0 4px; }
.rail-action { height: 44px; width: 46px; display: flex; align-items: center; justify-content: center; color: var(--muted); border-radius: 9px; }
.rail-action .icon, .rail-menu .icon { width: 21px; height: 21px; }
.rail-action:hover { color: var(--text); background: var(--hover); }
.rail-action.is-active { color: var(--accent-ink); background: var(--accent-bg); }
.rail-action.is-active .icon-nav-chat { fill: color-mix(in srgb, var(--accent-ink), transparent 88%); }
.rail-icon-box { position: relative; display: grid; place-items: center; width: 24px; height: 28px; flex: none; }
.rail-icon-box .counter { position: absolute; top: -6px; left: 14px; box-shadow: 0 0 0 2px var(--rail); height: 17px; min-width: 17px; }
.rail-action.is-active .counter { box-shadow: 0 0 0 2px var(--accent-bg); }
.rail-menu { width: 36px; height: 36px; color: var(--quiet); }
.rail-label, .rail-brand { display: none; }
.rail-expanded .rail-top { justify-content: flex-start; padding: 0 11px; gap: 7px; }
.rail-expanded .rail-brand { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 750; letter-spacing: .1em; }
.rail-expanded .rail-action { width: calc(100% - 22px); justify-content: flex-start; padding: 0 12px; gap: 12px; }
.rail-expanded .rail-label { display: block; font-size: 12px; white-space: nowrap; }
.rail-expanded .rail-rule { width: calc(100% - 40px); }
.rail-expanded .rail-action::after { display: none; }
.rail-profile .avatar { width: 31px; height: 31px; }
.avatar { position: relative; isolation: isolate; flex: none; width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 50%; vertical-align: middle; color: var(--avatar-ink, #c4c9ed); background: var(--avatar-bg, #343852); font-size: 13px; font-weight: 650; user-select: none; }
.avatar::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; border: 1px solid #ffffff1c; }
.avatar img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; position: absolute; inset: 0; }
.avatar .icon { width: 20px; height: 20px; }
.avatar .presence { position: absolute; z-index: 1; width: 9px; height: 9px; border-radius: 50%; right: 0; bottom: 0; background: var(--ok); box-shadow: 0 0 0 2px var(--sidebar); }
.rail-profile .presence { box-shadow: 0 0 0 2px var(--rail); }
.tone-sea { --avatar-bg: #294844; --avatar-ink: #93cebe; }
.tone-cobalt { --avatar-bg: #332e63; --avatar-ink: #c3bdf7; }
.tone-plum { --avatar-bg: #453652; --avatar-ink: #e0b8f5; }
.tone-sand { --avatar-bg: #504137; --avatar-ink: #e5bd9a; }
.tone-slate { --avatar-bg: #383b47; --avatar-ink: #c1c7d8; }
.side-heading { display: flex; align-items: center; justify-content: space-between; flex: none; height: var(--head-h); padding: 0 14px 0 19px; gap: 8px; }
.side-heading h1 { font-size: 19px; font-weight: 680; letter-spacing: -.035em; min-width: 0; }
.side-actions { display: flex; align-items: center; gap: 3px; }
.side-actions .icon-btn { width: 31px; height: 31px; }
.side-actions .icon { width: 18px; height: 18px; }
.side-actions .new-action { background: var(--field); color: var(--soft); }
.side-actions .new-action:hover { background: var(--selected); color: var(--text); }
.side-tools { display: flex; align-items: center; gap: 6px; padding: 0 13px 12px; flex: none; }
.side-tools .icon-btn { width: 33px; height: 33px; }
.search { border: 1px solid transparent; border-radius: 7px; color: var(--quiet); background: var(--field); display: flex; align-items: center; gap: 7px; min-width: 0; height: 34px; padding: 0 8px 0 9px; flex: 1; }
.search:focus-within { border-color: var(--accent); }
.search > .icon { width: 15px; height: 15px; }
.search input { background: none; border: 0; outline: none; width: 0; min-width: 0; flex: 1; color: var(--text); padding: 0; font-size: var(--body-size); }
.search input::-webkit-search-cancel-button { display: none; }
.search .icon-btn { width: 21px; height: 21px; border-radius: 5px; margin-right: -3px; }
.search .icon-btn .icon { width: 13px; height: 13px; }
.side-list { position: relative; flex: 1; padding: 0 9px 7px; }
.side-list.simple { padding-top: 1px; }
.side-label { padding: 7px 9px 6px; text-transform: uppercase; font-weight: 650; font-size: 9.5px; letter-spacing: .105em; color: var(--quiet); display: flex; align-items: center; gap: 6px; }
.side-label:not(:first-child) { padding-top: 14px; }
.chat-row { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 11px; min-height: var(--row-h); width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; margin-bottom: 2px; }
.chat-row:hover, .side-tab:hover { background: var(--hover); }
.chat-row.is-active { background: var(--selected); }
.chat-row:focus-visible, .side-tab:focus-visible { outline-offset: -2px; }
.chat-row.is-active .presence { box-shadow: 0 0 0 2px var(--selected); }
.chat-row:hover:not(.is-active) .presence { box-shadow: 0 0 0 2px var(--hover); }
.row-core { display: grid; gap: 3px; min-width: 0; }
.row-top, .row-sub { display: flex; align-items: center; justify-content: space-between; gap: 6px; line-height: 1.25; min-width: 0; min-height: 16px; }
.row-name { font-size: var(--body-size); font-weight: 620; color: var(--text); }
.row-mini { font-size: var(--small-size); color: var(--muted); min-width: 0; }
.row-mini.is-draft { color: var(--accent-ink); }
.row-mini > span { color: var(--quiet); }
.row-mini .icon { display: inline-block; vertical-align: -2px; margin-right: 3px; width: 12px; height: 12px; }
.chat-row.has-unread .row-name { font-weight: 700; }
.chat-row.has-unread .row-mini { color: var(--soft); }
.row-meta { display: inline-flex; align-items: center; gap: 4px; color: var(--quiet); font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.row-meta .icon, .row-sub > .icon { width: 12px; height: 12px; color: var(--quiet); }
.row-sub .counter { height: 17px; min-width: 17px; }
.side-footer { display: flex; align-items: center; border-top: 1px solid var(--line); min-height: 51px; padding: 5px 10px; flex: none; }
.side-footer .side-tab { margin: 0; }
.side-tab { display: flex; align-items: center; gap: 10px; min-height: 40px; width: 100%; padding: 0 10px; text-align: left; border-radius: 7px; color: var(--muted); margin-bottom: 3px; }
.side-tab .icon { width: 17px; height: 17px; }
.side-tab .counter { margin-left: auto; }
.side-tab.is-active { color: var(--text); background: var(--selected); font-weight: 600; }
.side-tab.is-active > .icon { color: var(--accent-ink); }
.side-empty { padding: 16px 12px; color: var(--quiet); font-size: var(--small-size); }
.side-note { color: var(--quiet); font-size: var(--small-size); padding: 0 18px 13px; }

/* 03 — Conversation, spaces and welcome */
.chat-head, .pane-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 20px 0 22px; height: var(--head-h); flex: none; border-bottom: 1px solid var(--line); }
.chat-head .avatar { width: 36px; height: 36px; }
.head-title { display: flex; align-items: center; gap: 10px; min-width: 0; text-align: left; }
button.head-title { padding: 3px 6px 3px 0; border-radius: 8px; }
button.head-title:hover strong { color: var(--accent-ink); }
.head-title strong { font-size: 14px; font-weight: 650; line-height: 1.3; }
.head-title > div { min-width: 0; }
.head-sub { display: flex; align-items: center; gap: 5px; color: var(--quiet); font-size: var(--small-size); line-height: 1.35; margin-top: 2px; }
.head-sub .status-dot { width: 5px; height: 5px; }
.head-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.pane-head h2 { font-size: 16px; font-weight: 650; letter-spacing: -.02em; }
.pane-head .head-sub { margin-top: 0; }
.welcome { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; text-align: center; padding: 30px 24px 72px; }
.welcome-content { display: flex; flex-direction: column; align-items: center; max-width: 490px; }
.welcome-art { width: 136px; height: 108px; margin: 0 0 18px; }
.welcome h2 { font-size: 25px; font-weight: 680; letter-spacing: -.048em; line-height: 1.2; }
.welcome p { color: var(--muted); font-size: 13px; margin: 9px 0 20px; }
.welcome .btn { min-height: 36px; padding: 0 13px; }
.welcome-foot { position: absolute; inset: auto 10px 18px; color: var(--quiet); font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 7px; }
.welcome-foot .icon { width: 13px; height: 13px; }
.word-dot { opacity: .65; }
.thread { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.thread-split { flex: 1; display: grid; grid-template-columns: clamp(140px, 14.6vw, 193px) minmax(0, 1fr); min-height: 0; }
.channel-panel { padding: 11px 9px; background: var(--sidebar); border-right: 1px solid var(--line); }
.channel-panel .side-tab { padding: 0 8px; font-size: var(--body-size); min-height: 35px; gap: 7px; }
.channel-panel .side-tab .icon { width: 16px; height: 16px; }
.channel-panel .side-label { margin-bottom: 3px; }
.channel-title .icon { color: var(--quiet); width: 21px; height: 21px; }
.channel-head { padding-left: 15px; height: 49px; }
.findbar { display: flex; flex: none; align-items: center; gap: 5px; padding: 7px 15px; border-bottom: 1px solid var(--line); background: var(--surface); }
.findbar .search { max-width: 340px; }
.findbar .small { white-space: nowrap; padding: 0 5px; }
.findbar .icon-btn { width: 29px; height: 29px; }
.findbar .icon-btn .icon { width: 16px; height: 16px; }
.chat-log { position: relative; flex: 1; }
.chat-log:focus-visible { outline-offset: -2px; }
.transcript { padding: 11px clamp(16px, 2.25vw, 33px) 12px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 100%; }
.date-divider, .unread-divider { display: flex; align-items: center; align-self: stretch; gap: 10px; color: var(--quiet); font-size: 10.5px; font-weight: 550; margin: 18px 0 16px; }
.date-divider::before, .date-divider::after, .unread-divider::before, .unread-divider::after { content: ''; height: 1px; flex: 1; background: var(--line); }
.date-divider time { padding: 2px 3px; }
.unread-divider { color: var(--accent-ink); margin: 12px 0; }
.unread-divider::before, .unread-divider::after { background: var(--accent-line); }
.message { display: flex; align-items: flex-end; gap: 7px; flex: none; padding: 2px 0; scroll-margin: 20px; }
.message:not(.continued) + .message:not(.continued), .message.continued + .message:not(.continued) { margin-top: 7px; }
.message.out { justify-content: flex-start; }
.message .avatar { width: 25px; height: 25px; margin-bottom: 3px; font-size: 9px; }
.message-avatar-space { width: 25px; flex: none; }
.bubble { max-width: min(76%, 620px); min-width: 0; border-radius: 13px 13px 13px 5px; padding: 8px 10px 7px; color: var(--text); background: var(--incoming); font-size: var(--message-size); line-height: 1.46; }
.message.out .bubble { border-radius: 13px 13px 13px 5px; color: var(--on-outgoing); background: var(--outgoing); }
.message.continued:not(.out) .bubble { border-top-left-radius: 5px; }
.message.continued.out .bubble { border-top-left-radius: 5px; }
.message.is-match .bubble { outline: 1px solid var(--accent); outline-offset: 2px; }
.message.is-match.is-current .bubble { outline: 2px solid var(--accent); }
.bubble-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble-meta { display: inline-flex; align-items: center; gap: 4px; float: right; height: 16px; margin: 5px 0 -2px 9px; color: var(--muted); font-size: 9.5px; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.out .bubble-meta { color: var(--meta-out); }
.bubble-meta .icon { width: 14px; height: 14px; }
.message-status { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 15px; flex: none; }
.message-status .icon { width: 16px; height: 16px; }
.message-status.is-sent { color: var(--meta-out); opacity: .58; }
.message-status.is-delivered { color: #aab4c4; opacity: .9; }
.message-status.is-read { color: #83e6ff; filter: drop-shadow(0 0 3px #48cfff) drop-shadow(0 0 6px #48cfff88); }
.message.out .bubble-author { color: var(--meta-out); }
.message .msg-tools { align-self: center; }
.bubble::after { content: ''; display: block; clear: both; }
.bubble-author { font-size: 11px; font-weight: 650; color: var(--accent-ink); margin-bottom: 3px; }
.bubble.has-image { padding: 4px 4px 7px; width: min(72%, 316px); }
.bubble.has-image .bubble-content { padding-inline: 6px; }
.bubble.has-image .bubble-author { padding: 4px 6px 0; }
.image-preview { display: block; width: 100%; border-radius: 9px; overflow: hidden; margin: 0 0 5px; background: var(--field); cursor: zoom-in; }
.image-preview img { width: 100%; display: block; aspect-ratio: 1.78; object-fit: cover; }
.image-preview:hover img { opacity: .9; }
.file-card { display: flex; align-items: center; width: min(260px, 100%); gap: 8px; border-radius: 7px; background: #0002; padding: 7px; color: inherit; text-decoration: none; margin-bottom: 3px; text-align: left; }
.file-card:hover { background: #0003; }
.file-card .icon { width: 17px; height: 17px; }
.file-card > span { flex: 1; min-width: 0; }
.file-card small { display: block; font-size: 10px; opacity: .84; }
.thread-empty { align-self: stretch; margin: auto 0; color: var(--quiet); padding: 30px 0; text-align: center; }
.thread-empty .avatar { width: 52px; height: 52px; margin: 0 auto 11px; }
.thread-empty strong { display: block; color: var(--soft); font-size: 14px; margin-bottom: 3px; }
.composer { position: relative; flex: none; padding: 10px clamp(15px, 2.1vw, 29px) 15px; border-top: 1px solid var(--line); }
.compose-row { display: flex; align-items: flex-end; gap: 7px; }
.compose-field { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 2px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 3px 5px; background: var(--field); }
.compose-field:focus-within { border-color: var(--accent); }
.compose-field textarea { width: 100%; flex: 1; min-width: 0; min-height: 31px; max-height: 124px; resize: none; outline: none; border: 0; padding: 6px 6px 5px 2px; background: none; line-height: 20px; font-size: var(--message-size); }
.compose-field .icon-btn { width: 31px; height: 31px; }
.compose-row > .icon-btn { width: 38px; height: 38px; }
.compose-row .send { color: var(--on-blue); background: var(--blue-solid); }
.compose-row .send:not(:disabled):hover { background: var(--blue-hover); color: var(--on-blue); }
.compose-row .send:disabled { background: var(--field); color: var(--quiet); opacity: 1; }
.compose-row .send .icon { width: 18px; height: 18px; }
.compose-attachment { display: inline-flex; align-items: center; max-width: min(330px, 100%); gap: 8px; padding: 3px 5px 3px 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); margin-bottom: 8px; color: var(--soft); }
.compose-attachment .icon { width: 15px; height: 15px; }
.compose-attachment .icon-btn { width: 24px; height: 24px; }
.compose-attachment .thumb { width: 28px; height: 28px; border-radius: 4px; object-fit: cover; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--line-strong); border-top-color: var(--accent-ink); border-radius: 50%; animation: spin .75s infinite linear; flex: none; }
@keyframes spin { to { rotate: 1turn; } }

/* === TYPHON WATER ANIMATIONS === */
/* 1. Message appear — detach from wall */
@keyframes msg-enter-in {
  from { opacity: 0; transform: translateX(-18px) scale(.96); }
  to   { opacity: 1; transform: none; }
}
@keyframes msg-enter-out {
  from { opacity: 0; transform: translateX(18px) scale(.96); }
  to   { opacity: 1; transform: none; }
}
.message.in.msg-new  { animation: msg-enter-in  .18s cubic-bezier(.22,.61,.36,1) both; }
.message.out.msg-new { animation: msg-enter-out .18s cubic-bezier(.22,.61,.36,1) both; }

/* 2. Send flash — accent ring on the new outgoing bubble */
@keyframes send-flash {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
  60%  { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 0%, transparent); }
  100% { box-shadow: none; }
}
.message.out.msg-sent .bubble { animation: send-flash .32s ease-out both; }

/* 3. Outgoing bubble: thin accent edge top */
.message.out .bubble { box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 28%, transparent); }

/* 4. Active chat row — teal left bar (ściana) */
.chat-row.is-active { border-left: 2px solid #3d9e9a; }
.chat-row { border-left: 2px solid transparent; transition: border-color .15s; }

/* 5. Compose field: animated bottom-line while typing */
.compose-field::after {
  content: ''; position: absolute; bottom: -1px; left: 0;
  height: 2px; background: var(--accent); border-radius: 1px;
  width: var(--compose-fill, 0%); transition: width .15s ease;
  pointer-events: none;
}
.compose-field { position: relative; overflow: visible; }

/* 6. Ping drip — dark droplet from bell icon */
@keyframes drip-drop {
  0%   { opacity: 0; transform: scale(.4) translateY(-6px); }
  25%  { opacity: 1; transform: scale(1) translateY(0); }
  75%  { opacity: 1; transform: scale(1) translateY(0); }
  100% { opacity: 0; transform: scale(.85) translateY(4px); }
}
.ping-drip {
  position: fixed; z-index: 9999; pointer-events: none;
  width: 44px; border-radius: 999px; overflow: hidden;
  background: var(--rail); border: 1px solid var(--line-strong);
  box-shadow: 0 4px 14px #0007; padding: 7px 10px;
  font-size: 12px; line-height: 1.35; color: var(--text);
  animation: drip-drop .26s cubic-bezier(.25,.8,.25,1) both;
}
.ping-drip.drip-out { animation: drip-drop .2s reverse ease-in both; }
.ping-drip strong { display: block; font-size: 11px; color: var(--accent-ink); font-weight: 650; }
/* === END TYPHON WATER ANIMATIONS === */

/* 04 — Friends, activity, settings */
.pane-scroll { position: relative; flex: 1; }
.pane { max-width: 860px; margin: 0 auto; padding: 22px 28px 34px; }

select { background: var(--field); padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px; min-width: 115px; }

/* 05 — Context actions, dialog and feedback */
.popover { z-index: 23; position: fixed; min-width: 184px; max-width: 275px; border: 1px solid var(--line-strong); background: var(--raised); box-shadow: var(--shadow); border-radius: 9px; padding: 4px; }

.menu-item .icon { width: 16px; height: 16px; color: var(--muted); }

.modal { width: min(460px, calc(100vw - 36px)); max-height: calc(100dvh - 38px); margin: auto; padding: 0; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 13px; box-shadow: 0 16px 52px #0006; background: var(--raised); color: var(--text); }

.selection { margin: 10px 0 3px; display: flex; flex-wrap: wrap; gap: 5px; min-height: 23px; }

.picker-row input[type='checkbox']:checked::after { content: ''; border: solid white; border-width: 0 1.6px 1.6px 0; width: 5px; height: 8px; transform: rotate(45deg); position: absolute; left: 4px; top: 1px; }

@media (max-height: 625px) {

/* TYPHON LIVE / Account shell and synchronized states. */

.password-eye:hover { color: var(--text); background: var(--selected); }
.password-eye .icon { width: 17px; height: 17px; }
.handle-field { display: flex; align-items: center; gap: 6px; padding-inline: 9px; margin-top: 5px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--field); }

.sign-submit { width: 100%; min-height: 38px; }

.sign-footer { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 11px; color: var(--quiet); padding: 18px 0 0; }

.recovery-code { display: block; border: 1px solid var(--accent-line); background: var(--accent-bg); padding: 9px 7px; border-radius: 6px; color: var(--accent-ink); font: 12.5px/1.5 ui-monospace,monospace; text-align: center; user-select: all; overflow-wrap: anywhere; }
#recovery-confirm { margin-top: 12px; display: grid; gap: 10px; }
.sign-panel > .btn.ghost { margin-top: 5px; }
#network-state.offline { color: var(--warn); }
#network-alert { display: none; }
.welcome-content > .btn.ghost { margin-top: 6px; }
.presence.away, .status-dot.away { background: var(--warn); }
.presence.dnd, .status-dot.dnd { background: var(--danger); }
.loading-state { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.message .msg-actions { display: inline-flex; align-items: center; gap: 2px; align-self: center; opacity: 0; pointer-events: none; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 9px; padding: 2px 3px; box-shadow: 0 4px 14px rgba(0,0,0,0.32); transition: opacity .12s ease; flex: none; margin: 0 4px; }

@media(max-width:680px){ .message .msg-quick-rx { display: none; } }
.bubble a { color: inherit; text-underline-offset: 3px; }
.mention { color: inherit; background: color-mix(in srgb,var(--accent),transparent 65%); padding-inline: 2px; border-radius: 3px; }
.out .mention { background: #ffffff37; }
.quote { display: block; width: 100%; max-width: min(100%,350px); padding: 4px 7px; text-align: left; border-left: 2px solid var(--accent-ink); background: #0002; border-radius: 4px; margin-bottom: 6px; }

.poll-card { min-width: min(284px,100%); margin-bottom: 4px; padding: 3px 2px; }

      if(g!==generation)return null;

  function customPicker(name,value,opts,attributes=''){
    const options=opts.map(([v,label,disabled=false])=>({value:String(v),label:String(label),disabled:!!disabled}));
    const chosen=options.find(o=>o.value===String(value))||options[0]||{value:'',label:'Wybierz'};
    return `<div class="reef-picker" data-picker><input type="hidden"${name?` name="${esc(name)}"`:''} ${attributes} value="${esc(chosen.value)}"><button type="button" class="reef-picker-trigger" data-act="picker-toggle" aria-haspopup="listbox" aria-expanded="false"><span data-picker-label>${esc(chosen.label)}</span>${svg('chevron')}</button><div class="reef-picker-menu" role="listbox">${options.map(o=>`<button type="button" class="reef-picker-option" role="option" data-act="picker-option" data-value="${esc(o.value)}" data-label="${esc(o.label)}" aria-selected="${o.value===chosen.value?'true':'false'}" ${o.disabled?'disabled':''}><span>${esc(o.label)}</span><span class="picker-check">${o.value===chosen.value?svg('check'):''}</span></button>`).join('')}</div></div>`;
  }
  function syncPickerLabel(input){
    const root=input?.closest('.reef-picker');if(!root)return;
    const choice=[...root.querySelectorAll('.reef-picker-option')].find(o=>o.dataset.value===input.value);
    const label=root.querySelector('[data-picker-label]');if(label)label.textContent=choice?.dataset.label||'Wybierz';
    root.querySelectorAll('.reef-picker-option').forEach(o=>{
      const selected=o.dataset.value===input.value;
      o.setAttribute('aria-selected',String(selected));
      let check=o.querySelector('.picker-check');
      if(!check){
        o.querySelectorAll('svg').forEach(s=>s.remove());
        check=document.createElement('span');
        check.className='picker-check';
        o.append(check);
      }
      check.innerHTML=selected?svg('check'):'';
    });
  }
  function setPickerOptions(id,opts,value,disabled=false){
    const input=document.getElementById(id),root=input?.closest('.reef-picker');if(!input||!root)return;
    const list=opts.map(([v,label,off=false])=>({value:String(v),label:String(label),disabled:!!off}));
    if(!list.some(o=>o.value===String(value)))value=list[0]?.value??'';
    input.value=String(value??'');
    root.querySelector('.reef-picker-menu').innerHTML=list.map(o=>`<button type="button" class="reef-picker-option" role="option" data-act="picker-option" data-value="${esc(o.value)}" data-label="${esc(o.label)}" aria-selected="${o.value===input.value?'true':'false'}" ${o.disabled?'disabled':''}><span>${esc(o.label)}</span><span class="picker-check">${o.value===input.value?svg('check'):''}</span></button>`).join('');
    root.querySelector('.reef-picker-trigger').disabled=!!disabled;syncPickerLabel(input);
  }

  async function beginAccountCredentialChange(form,regeneration=false){
    if(regeneration||credentialBusy||form.dataset.busy)return;
    const fields=Object.fromEntries(new FormData(form));
    credentialBusy=true;form.dataset.busy='1';
    const submit=form.querySelector('button[type="submit"]');if(submit){submit.disabled=true;submit.dataset.originalText=submit.textContent;submit.textContent='Zmienianie…';}
    try{await ReefAuth.changePassword(fields.currentPassword,fields.newPassword,fields.confirmPassword);form.reset();toast('Hasło zostało zmienione.');}
    catch(error){toast(error.message||'Nie udało się zmienić hasła.',true);}
    finally{credentialBusy=false;if(form.isConnected){delete form.dataset.busy;if(submit){submit.disabled=false;submit.textContent=submit.dataset.originalText||'Zmień hasło';delete submit.dataset.originalText;}}}
  }

  function toast(message, isError = false) {
    const host = modal.open ? $('#modal-feedback') : $('#toasts');
    if (!host) return;
    const item = document.createElement('div');
    item.className = `toast${isError ? ' error' : ''}`;
    item.setAttribute('role',isError ? 'alert' : 'status');
    item.innerHTML = `${svg(isError ? 'warning' : 'check')}<span>${esc(message)}</span>`;
    host.append(item);
    while (host.children.length > 3) host.firstElementChild.remove();
    setTimeout(() => item.remove(),isError ? 5700 : 3100);
  }

function animateAuthPanel(host,previousHeight,previousPositions={}){

  el.style.height='0px';
  el.style.opacity='0';

  const next=movingBlock.getBoundingClientRect();
  const dy=Math.round(oldPosition.top-next.top);
  if(Math.abs(dy)>1){
   movingBlock.style.transition='none';
   movingBlock.style.transform=`translateY(${dy}px)`;
   movingBlock.style.willChange='transform';
   movingBlock.getBoundingClientRect();
   requestAnimationFrame(()=>{
    if(!movingBlock.isConnected)return;
    movingBlock.style.transition='transform 280ms cubic-bezier(.22,.68,.2,1)';
    movingBlock.style.transform='translateY(0)';
   });
   const cleanMove=()=>{
    movingBlock.style.transition='';movingBlock.style.transform='';movingBlock.style.willChange='';
   };
   movingBlock.addEventListener('transitionend',event=>{
    if(event.target===movingBlock&&event.propertyName==='transform')cleanMove();
   },{once:true});
   setTimeout(cleanMove,380);
  }
 }
 // Expand newly added recovery rows smoothly. Their contents stay aligned as a unit.
 recoveryRows.forEach(({el,height})=>{
  if(!height||!el.animate)return;
  const animation=el.animate(
   [{height:'0px',opacity:0},{height:`${Math.ceil(height)}px`,opacity:1}],
   {duration:280,easing:'cubic-bezier(.22,.68,.2,1)'}
  );
  animation.onfinish=()=>{
   if(!el.isConnected)return;
   el.style.height='';el.style.opacity='';el.style.overflow='';
  };
 });
 // Keep the existing registration confirmation-row fade; recovery rows use the height animation above.
 for(const key of ['confirm','betaCode','phrase']){
  const old=previousPositions[key];
  const name=key;
  const el=panel.querySelector(`[name="${name}"]`)?.closest('.label-input');
  if(!old&&el&&el.animate&&!el.closest('.auth-reveal-recover')){
   el.animate([{opacity:0},{opacity:1}],{duration:190,easing:'ease-out'});
  }
 }
 let finished=false;
 const finish=()=>{
  if(finished)return;finished=true;
  panel.style.height='auto';panel.style.overflow='';panel.style.transition='';
  panel.removeEventListener('transitionend',onEnd);
 };
 const onEnd=event=>{if(event.target===panel&&event.propertyName==='height')finish();};
 panel.addEventListener('transitionend',onEnd);
 requestAnimationFrame(()=>{
  if(!panel.isConnected){finish();return;}
  panel.style.height=`${Math.ceil(targetHeight)}px`;
 });
 setTimeout(finish,440);
}

        if(c?.status==='rejected'||c?.status==='missed')toast(c.status==='rejected'?'Połączenie odrzucone.':'Brak odpowiedzi na połączenie.');

    }else if((c&&this.callId)||this.voicePath){

      const member=c?person(c.from===own?c.to:c.from):null;

      put(`${member?avatar(member):svg('sound')}<div class="call-copy"><strong class="ellipsis">${esc(member?.name||channel?.name||'Rozmowa głosowa')}</strong><p class="small">${esc(subtitle)}</p>${this.qualityText()?`<p class="call-quality">${esc(this.qualityText())}</p>`:''}${this.ice&&!this.ice.turn?'<p class="call-quality" title="Bez TURN część sieci nie pozwoli na rozmowę.">STUN-only · TURN nieskonfigurowany</p>':''}</div>

let micTestStream=null,micTestContext=null,micTestAnalyser=null,micTestFrame=0;
async function stopMicTest(){
  if(micTestFrame)cancelAnimationFrame(micTestFrame);
  micTestFrame=0;micTestAnalyser=null;
  if(micTestStream)micTestStream.getTracks().forEach(track=>track.stop());
  micTestStream=null;
  if(micTestContext){try{await micTestContext.close();}catch{}micTestContext=null;}
  const level=$('#mic-test-level');if(level)level.style.width='0%';
  const status=$('#mic-test-status');if(status)status.textContent='Test nie jest aktywny.';
  const btn=$('[data-act="mic-test-toggle"]');if(btn){btn.disabled=false;btn.textContent='Rozpocznij test';}
}
async function toggleMicTest(){
  if(micTestStream){await stopMicTest();return;}
  const status=$('#mic-test-status'),btn=$('[data-act="mic-test-toggle"]');
  if(status)status.textContent='Oczekiwanie na dostęp do mikrofonu…';if(btn)btn.disabled=true;
  try{
    const stream=await RTC.mic();
    if(ui.view!=='settings'||ui.setting!=='audio'){stream.getTracks().forEach(track=>track.stop());return;}
    const AudioContextCtor=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextCtor)throw new Error('Ta przeglądarka nie obsługuje pomiaru poziomu mikrofonu.');
    micTestStream=stream;micTestContext=new AudioContextCtor();await micTestContext.resume();
    const source=micTestContext.createMediaStreamSource(stream),analyser=micTestContext.createAnalyser();
    analyser.fftSize=512;source.connect(analyser);micTestAnalyser=analyser;
    const samples=new Uint8Array(analyser.fftSize);
    if(status)status.textContent='Test aktywny. Mów normalnym głosem.';
    if(btn){btn.disabled=false;btn.textContent='Zatrzymaj test';}
    const draw=()=>{
      if(!micTestAnalyser||!micTestStream)return;
      analyser.getByteTimeDomainData(samples);let sum=0;
      for(const sample of samples){const v=(sample-128)/128;sum+=v*v;}
      const rms=Math.sqrt(sum/samples.length),level=$('#mic-test-level');
      if(level)level.style.width=`${Math.min(100,Math.max(0,Math.round(rms*330)))}%`;
      micTestFrame=requestAnimationFrame(draw);
    };draw();
  }catch(error){await stopMicTest();toast(error.message||'Nie udało się uruchomić testu mikrofonu.',true);}
}

const olderPages=new Map();
function threadRows(t){const old=t.data.older||olderPages.get(t.path)?.rows||[],all=new Map([...old,...t.data.messages].map(m=>[m.id,m]));return [...all.values()].sort((a,b)=>a.at-b.at||(a.id===b.id?0:a.id<b.id?-1:1));}
async function previousPage(){
 const t=currentThread();if(!t||t.loading)return;
 const prev=olderPages.get(t.path)||{rows:[]};if(prev.loading||prev.done)return;
 const before=threadRows(t)[0]?.id;if(!before)return;
 const g=generation;prev.loading=true;olderPages.set(t.path,prev);
 try{const r=await api('history?'+new URLSearchParams({path:t.path,before}));if(g!==generation||activePath()!==t.path)return;
  const existing=new Set(prev.rows.map(m=>m.id));for(const m of r.messages){if(!existing.has(m.id))prev.rows.push(wire(m,db.profile.uid));}
  prev.done=r.messages.length<299;await refresh();if(g!==generation||activePath()!==t.path)return;refreshThread();
  const anchor=$('[data-message="'+CSS.escape(before)+'"]');if(log?.isConnected&&anchor&&Number.isFinite(offset))log.scrollTop+=anchor.getBoundingClientRect().top-offset;
  if(!r.messages.length)toast('To najstarsza dostępna wiadomość.');
 }catch(e){if(g===generation)toast(e.message,true);}finally{prev.loading=false;}
}

function linkPreview(body){
 const raw=String(body||'').match(/https?:\/\/[^\s<>]+/i)?.[0];if(!raw)return '';
 const value=safeWebURL(raw);if(!value)return '';
 const u=new URL(value),parts=u.pathname+u.search;return `<a class="link-preview" href="${esc(value)}" target="_blank" rel="noopener noreferrer">${svg('link')}<span><strong>${esc(u.hostname)}</strong><span>${esc(parts.slice(0,94))}</span></span></a>`;
}

const queuedFeedback=new Map();
function reviewQualifyingCalls(state){
 const uid=state.profile.uid,now=state.serverTime||Date.now();
 for(const c of [...(state.callHistory||[])].reverse()){
   if(!c.qualified||c.updated<now-120000)continue;
   const peer=c.from===uid?c.to:c.from,k=`flux_call_count_${uid}_${peer}`,old=localJSON(k+'_ids',[]);
   const seen=new Set(Array.isArray(old)?old:[readLocal(k+'_last')]);const prior=readLocal(k+'_last');if(prior)seen.add(prior);
   if(seen.has(c.id))continue;
   const count=(Number(readLocal(k,'0'))||0)+1;seen.add(c.id);
   saveLocal(k,String(count));saveLocal(k+'_ids',JSON.stringify([...seen].slice(-72)));
   if(count%4===0&&state.settings.callFeedbackEnabled)queuedFeedback.set(c.id,{c,peer,count});
 }
 if(ui.modal||RTC.callId||RTC.voicePath||!queuedFeedback.size)return;
 const [id,f]=queuedFeedback.entries().next().value;queuedFeedback.delete(id);
 if(now-f.c.updated>600000)return;
 openModal({type:'report',kind:'call_feedback',id,evidence:`${f.count}. nawiązana rozmowa z: ${person(f.peer)?.name||'Użytkownik TYPHON'}`});
}
function switchResults(q){
 const own= db.chats.map(c=>({kind:'chat',id:c.id,label:chatFace(c).name,sub:c.type==='direct'?'@'+(chatFace(c).handle||''):'Rozmowa',icon:'nav-chat',body:lastMessage(c)?.body||'',score:lastMessage(c)?.at||c.created}));
 const servers=db.servers.flatMap(s=>[{kind:'server',id:s.id,label:s.name,sub:'Serwer',icon:'server'},...s.channels.map(c=>({kind:'channel',sid:s.id,id:c.id,label:'#'+c.name,sub:s.name,icon:c.type==='voice'?'sound':'hash'}))]);
 const friends=friendPeople().filter(p=>!db.chats.some(c=>c.person===p.id)).map(p=>({kind:'friend',id:p.id,label:p.name,sub:'@'+p.handle,icon:'user'}));
 const norm=normalize(q);const rows=[...own,...servers,...friends].filter(x=>!norm||[x.label,x.sub,x.body].some(t=>normalize(t||'').includes(norm)))
  .sort((a,b)=>Number(normalize(b.label).startsWith(norm))-Number(normalize(a.label).startsWith(norm))||(b.score||0)-(a.score||0)||a.label.localeCompare(b.label,'pl')).slice(0,18);
 return rows.length?rows.map(x=>`<button type="button" class="record command-row" ${attrs('switch-target',`${bind('kind',x.kind)} ${bind('id',x.id)} ${x.sid?bind('sid',x.sid):''}`)}>${svg(x.icon)}<span class="record-main"><strong class="record-name">${esc(x.label)}</strong><span class="record-sub">${esc(x.sub)}</span></span>${svg('forward')}</button>`).join(''):'<p class="side-empty">Nie znaleziono rozmowy, osoby ani kanału.</p>';
}

function refreshThread(){
  const t=currentThread(), log=$('#chat-log');if(!t||!log||log.dataset.thread!==t.key)return;
  const authors=t.useAuthors?[...new Set(t.data.messages.map(m=>m.from))].map(id=>{const p=person(id);return [p?.name,p?.photo];}):[];
  const body=$('#transcript'), digest=JSON.stringify([t.loading,threadRows(t),olderPages.get(t.path)?.done,authors,ui.unreadMarkers[t.path],db.settings.mentionHighlightEnabled,db.profile.handle]);
  if(body.dataset.digest!==digest){
    const focus=body.contains(document.activeElement)?document.activeElement:null;
    const tools=body.contains(ui.pop?.anchor)?ui.pop.anchor:null;
    const reanchor=btn=>btn?.dataset.act&&body.querySelector(`[data-act="${CSS.escape(btn.dataset.act)}"][data-id="${CSS.escape(btn.dataset.id||'')}"]${btn.dataset.choice?`[data-choice="${CSS.escape(btn.dataset.choice)}"]`:''}${btn.dataset.emoji?`[data-emoji="${CSS.escape(btn.dataset.emoji)}"]`:''}`);
    saveScroll();body.innerHTML=transcript(t);body.dataset.digest=digest;scrollConversation();
    const next=reanchor(tools);
    if(next){ui.pop.anchor=next;next.setAttribute('aria-expanded','true');positionPop();}else if(tools)closePop();
    reanchor(focus)?.focus({preventScroll:true});hydrateMedia(body);updateMatches(false);
  }
  updateTyping(t);
}
function syncView(old,thread){
  const view=ui.view;
  updateBell();
  if(old.settings.defaultCallGain!==db.settings.defaultCallGain)RTC.peers.forEach(p=>{if(p.player)p.player.volume=db.settings.defaultCallGain;});
  const own=p=>[p?.name,p?.photo,p?.status];
  if(JSON.stringify(own(db.profile))!==JSON.stringify(own(old.profile))||old.settings.lastSeenEnabled!==db.settings.lastSeenEnabled)renderRail();
  const visualPeople=(data)=>data.people.map(p=>[p.id,p.name,p.photo,p.status,p.handle]);
  const peopleChanged=JSON.stringify(visualPeople(db))!==JSON.stringify(visualPeople(old));
  let sideUpdated=false;
  if(view==='chats'&& (peopleChanged||JSON.stringify(db.chats)!==JSON.stringify(old.chats)||JSON.stringify(old.settings)!==JSON.stringify(db.settings))){
    updateSidebarRows();sideUpdated=true;
  }
  if(view==='servers'&&JSON.stringify(old.servers)!==JSON.stringify(db.servers)){
    updateSidebarRows();sideUpdated=true;
  }
  const path=activePath();
  if(view==='chats'||view==='servers'){
    if(path && $('#chat-log')?.dataset.thread!==path || !path && $('#chat-log'))renderMain();
    else if(path){
      refreshThread();
      const t=currentThread(), currentHeader=workspace.querySelector('.thread > .chat-head');
      if((peopleChanged||sideUpdated)&&currentHeader){const updated=threadHeader(t);if(!ui.pop&&currentHeader.dataset.header!==updated){currentHeader.outerHTML=updated;workspace.querySelector('.thread > .chat-head').dataset.header=updated;hydrateMedia(workspace);}}
      if(view==='servers'&&sideUpdated){const panel=$('#channel-panel');if(panel){panel.innerHTML=categoryChannels(t.server,t.channel);const header=$('.server-head .head-title');if(header){header.querySelector('strong').textContent=t.server.name;header.querySelector('.head-sub').textContent=t.server.description||countWord(t.server.members.length+1,'członek','członkowie','członków');}}}
    }else if(view==='servers'&&sideUpdated)renderMain();
  }
  if(view==='friends'&&(peopleChanged||old.friends.join()!==db.friends.join()||JSON.stringify(old.invites)!==JSON.stringify(db.invites)||JSON.stringify(old.serverInvites)!==JSON.stringify(db.serverInvites))){
    renderSidebar(true);$('#friend-results').innerHTML=friendList();$('#friend-count').textContent=friendCounter();hydrateMedia();
  }
  if(view==='notifications'&&(JSON.stringify(old.events)!==JSON.stringify(db.events)||JSON.stringify(old.settings)!==JSON.stringify(db.settings)||ui.statusDigest!==ui.shownDigest)){
    renderSidebar(true);const top=$('.pane-scroll')?.scrollTop||0;renderMain();$('.pane-scroll').scrollTop=top;ui.shownDigest=ui.statusDigest;
  }
  if(view==='settings'||view==='profile'){
    $$('[data-setting]',workspace).forEach(i=>{const v=db.settings[i.dataset.setting];if(i.type==='checkbox')i.checked=!!v;else{i.value=String(v);syncPickerLabel(i);}});
    if(ui.setting==='account'&&ui.profileEdit)syncProfileEditor();
    if((ui.setting==='privacy'&&old.blocked.join()!==db.blocked.join())||(ui.setting==='badges'&&old.profile.badges.join()!==db.profile.badges.join()))renderMain();
    if(ui.setting==='privacy')$$('[data-badge-visible]',workspace).forEach(i=>i.checked=!db.settings.hiddenBadges[i.dataset.badgeVisible]);
    if(ui.setting==='notifications'){
      const serverNames=db.servers.map(s=>[s.id,s.name]),oldNames=old.servers.map(s=>[s.id,s.name]);
      if(JSON.stringify(serverNames)!==JSON.stringify(oldNames))renderMain();
      $$('[data-server-mode]',workspace).forEach(i=>{i.value=db.settings.serverModes[i.dataset.serverMode]||'all';syncPickerLabel(i);});
      $$('[data-server-muted]',workspace).forEach(i=>i.checked=muted('server:'+i.dataset.serverMuted));
    }
    if(['info'].includes(ui.setting)&&(JSON.stringify(old.system)!==JSON.stringify(db.system)||JSON.stringify(old.systemUpdate)!==JSON.stringify(db.systemUpdate)||JSON.stringify(old.userAnnouncement)!==JSON.stringify(db.userAnnouncement)))renderMain();
    if(ui.setting==='notifications'&&$('#notification-permission'))$('#notification-permission').textContent=notificationPermissionText();
    if(['reports'].includes(ui.setting)&&old.reportRevision!==db.reportRevision)loadReports(false);
  }
  const d=ui.modal;
  if(d&&['directory'].includes(d.type)&&(old.friends.join()!==db.friends.join()||JSON.stringify(old.invites)!==JSON.stringify(db.invites))&&$('#directory-results')){$('#directory-results').innerHTML=directoryRows(d);hydrateMedia(modal);}
  if(d&&['server-events','server-moderation','server-event-edit'].includes(d.type)&&!serverFor(d.sid))closeModal();
  else if(d&&['server-events','server-moderation'].includes(d.type)&&JSON.stringify(old.servers.find(x=>x.id===d.sid))!==JSON.stringify(serverFor(d.sid)))showModalContent();
  if(ui.pop&&!ui.pop.anchor.isConnected)closePop();
  hydrateMedia();
}

let notifAudio=null;

let outgoingCallAudio=null, incomingCallAudio=null;
function startOutgoingRing(){
  try{
    if(!outgoingCallAudio){outgoingCallAudio=new Audio(REEF_OUTGOING_CALL_MP3);outgoingCallAudio.loop=true;}
    outgoingCallAudio.currentTime=0;
    const p=outgoingCallAudio.play();
    if(p&&p.catch)p.catch(()=>{});
  }catch{}
}
function stopOutgoingRing(){
  try{if(outgoingCallAudio){outgoingCallAudio.pause();outgoingCallAudio.currentTime=0;}}catch{}
}
let incomingRingTimer=0;
function startIncomingRing(){
  if(incomingRingTimer)return;
  incomingRingTimer=setInterval(()=>{
    try{
      if(!audioContext){audioContext=new (window.AudioContext||window.webkitAudioContext)();}
      if(audioContext.state==='suspended')audioContext.resume();
      const now=audioContext.currentTime;
      for(const [f,t] of [[440,0],[480,0.12],[440,0.5],[480,0.62]]){
        const o=audioContext.createOscillator(),g=audioContext.createGain();
        o.type='sine';o.frequency.value=f;
        const s=now+t;
        g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.12,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.18);
        o.connect(g).connect(audioContext.destination);o.start(s);o.stop(s+0.2);
      }
    }catch{}
  },2200);
  // immediate first ring
  try{
    if(!audioContext){audioContext=new (window.AudioContext||window.webkitAudioContext)();}
    if(audioContext.state==='suspended')audioContext.resume();
    const now=audioContext.currentTime;
    for(const [f,t] of [[440,0],[480,0.12]]){
      const o=audioContext.createOscillator(),g=audioContext.createGain();
      o.type='sine';o.frequency.value=f;
      const s=now+t;
      g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.12,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.18);
      o.connect(g).connect(audioContext.destination);o.start(s);o.stop(s+0.2);
    }
  }catch{}
}
function stopIncomingRing(){
  if(incomingRingTimer){clearInterval(incomingRingTimer);incomingRingTimer=0;}
  try{if(incomingCallAudio){incomingCallAudio.pause();incomingCallAudio.currentTime=0;}}catch{}
}

function activityChime(mention){
  try{
    if(!notifAudio)notifAudio=new Audio(REEF_NOTIF_MP3);
    const a=notifAudio.cloneNode();
    a.volume=mention?0.75:0.5;
    const p=a.play();
    if(p&&p.catch)p.catch(()=>fallbackChime(mention));
    return;
  }catch{}
  fallbackChime(mention);
}
function fallbackChime(mention){
  if(!audioContext||audioContext.state!=='running')return;
  const osc=audioContext.createOscillator(), gain=audioContext.createGain(),now=audioContext.currentTime;
  osc.type='sine';osc.frequency.setValueAtTime(mention?784:550,now);osc.frequency.setValueAtTime(mention?980:500,now+.08);
  gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.075,now+.022);gain.gain.exponentialRampToValueAtTime(.0001,now+.16);
  osc.connect(gain).connect(audioContext.destination);osc.start(now);osc.stop(now+.18);
}
function announceActivity(old,first){
  if(first){activityAt=Date.now();awayAutomatic=false;dndBaseline=db.profile.status==='dnd'?new Map(db.chats.map(c=>[c.id,c.unread])):null;return;}
  if(old.profile?.status!=='dnd'&&db.profile.status==='dnd'){dndBaseline=new Map(old.chats.map(c=>[c.id,c.unread]));ui.statusDigest=null;}
  else if(old.profile?.status==='dnd'&&db.profile.status!=='dnd'&&dndBaseline){
    ui.statusDigest=db.chats.filter(c=>c.type==='direct').reduce((n,c)=>n+Math.max(0,c.unread-(dndBaseline.get(c.id)||0)),0)||null;
    dndBaseline=null;if(ui.view==='notifications')renderMain();
  }
  if(db.profile.status==='dnd')return;
  const previous=new Set(old.events.map(e=>e.id));
  for(const e of db.events){
    if(e.read||previous.has(e.id)||!shouldNotify(e)||Date.now()-e.at>5000)continue;
    const visible=!!e.path&&e.path===activePath()&&!document.hidden;
    if(!visible&&!document.hidden)toast(e.title);
    if(db.settings.chatSoundEnabled&&(['message','server','call'].includes(e.type))&&(!e.mention||db.settings.mentionSoundEnabled&&!visible))activityChime(e.mention);
    /* ping drip */
    if(e.mention&&!visible){
      const bell=document.querySelector('.rail-action [data-view="notifications"]')?.closest('.rail-action')||document.querySelector('[data-view="notifications"]');
      if(bell){
        const r=bell.getBoundingClientRect();
        const d=document.createElement('div');d.className='ping-drip';
        const preview=(e.detail||e.title||'').slice(0,80);
        d.innerHTML='<strong>'+e.title.replace(/</g,'&lt;')+'</strong>'+(preview?'<span>'+preview.replace(/</g,'&lt;')+'</span>':'');
        d.style.top=(r.bottom+6)+'px';d.style.left=Math.min(r.left,window.innerWidth-220)+'px';
        document.body.appendChild(d);
        const tid=setTimeout(()=>{d.classList.add('drip-out');setTimeout(()=>d.remove(),220);},3200);
        d.addEventListener('click',()=>{clearTimeout(tid);d.remove();},{ once:true });
      }
    }
    if(!visible&&db.settings.notifSysEnabled){
      if(reefTauriNotify(e.title,e.detail)){}
      else if('Notification'in window&&Notification.permission==='granted'){
        try{const n=new Notification(e.title,{body:e.detail,tag:'reef-'+(e.path||e.id),silent:true});n.onclick=()=>{window.focus();n.close();openEvent(e.id);};setTimeout(()=>n.close(),8000);}catch{}
      }
    }
  }
}
function noteNavDeparture(){clearTimeout(typingTimer);typingAt=0;const p=activePath();if(p){operate('typing',{path:p,active:false}).catch(()=>{});if(olderPages.has(p)){olderPages.delete(p);const t=threadCache.get(p);if(t)delete t.older;operate('history.close',{path:p}).catch(()=>{});}}clearTimeout(readTimer);readTimer=0;saveScroll();}
function navigate(view){
  if(!['chats','friends','servers','notifications','settings','profile'].includes(view)||!db.profile||view===ui.view)return;
  if(ui.setting==='audio')stopMicTest();
  noteNavDeparture();ui.view=view;
  if(view==='profile'){ui.setting='account';profileEditor();}
  if(view==='friends'){ui.friendTab='all';ui.friendQuery='';}
  if(view==='settings')ui.setting=Object.hasOwn(categories,ui.lastSetting)?ui.lastSetting:'info';
  renderScreen(); if(view==='settings'&&ui.setting==='reports')loadReports(); refresh();
}
function selectChat(cid,focus=false,fromOther=false){
  const c=chatFor(cid); if(!c)return;
  if(ui.setting==='audio')stopMicTest();
  noteNavDeparture();if(ui.view!=='chats'||fromOther){ui.chatQuery='';ui.chatFilter='all';}
  if(!Object.hasOwn(filters,ui.chatFilter))ui.chatFilter='all';
  ui.view='chats';ui.chat=cid;db.last.chat=cid;saveNav();readProgress.delete(c.path);
  if(c.unread){const cached=threadCache.get(c.path);if(cached)ui.unreadMarkers[c.path]=cached.messages.find(m=>m.from!=='me'&&m.seq>cached.readSeq)?.id;}
  renderScreen(true);refresh();
  if(focus)$('#message-input')?.focus();else sidebar.querySelector(`[data-act="open-chat"][data-id="${CSS.escape(cid)}"]`)?.focus({preventScroll:true});
}
async function directChat(id){const r=await change('dm.open',{id});if(r){if(modal.open)closeModal();selectChat(r.id,true,true);}}
function selectServer(id,cid=null,fromOther=false){
  const s=serverFor(id); if(!s)return;
  if(ui.setting==='audio')stopMicTest();
  noteNavDeparture();if(ui.view!=='servers'||fromOther)ui.serverQuery='';
  const c=s.channels.find(c=>c.id===(cid||db.last.channels[id]))||s.channels[0];
  ui.view='servers';ui.server=id;db.last.server=id;db.last.channels[id]=c.id;saveNav();readProgress.delete(c.path);renderScreen(true);refresh();
}
async function openEvent(id){
  const e=db.events.find(x=>x.id===id);if(!e)return;
  await change('event.read',{id});
  if(e.path?.startsWith('messages/'))selectChat(e.path.split('/')[1],false,true);
  else if(e.path?.startsWith('serverMessages/')){const [,sid,c]=e.path.split('/');selectServer(sid,c,true);}
  else if(e.type==='serverInvite'||e.type==='friend'){ui.eventFilter='all';if(ui.view!=='notifications'){noteNavDeparture();ui.view='notifications';}renderScreen(true);}
  else if(e.type==='report')setCategory('reports');else if(e.type==='announcement')setCategory('info');
}

function setCategory(key){
  if(!Object.hasOwn(categories,key))return;
  if(ui.setting==='audio'&&key!=='audio')stopMicTest();
  noteNavDeparture();ui.view=ui.view==='profile'&&key==='account'?'profile':'settings';ui.setting=key;if(ui.view==='settings')ui.lastSetting=key;
  if(key==='account')profileEditor();
  if(key==='reports')ui.reportTab='mine';
  renderScreen(true);
  if(key==='reports')loadReports();sidebar.querySelector(`[data-id="${key}"]`)?.focus({preventScroll:true});
}
let reportLoad=0;
async function loadReports(spinner=true){
  const n=++reportLoad,g=generation;ui.reportBusy=spinner;ui.reportError='';
  let node=$('#report-rows');if(node&&spinner)node.innerHTML=reportHTML();
  try{const r=await api('reports');if(n===reportLoad&&g===generation)ui.reportRows=r.reports;}
  catch(e){if(n===reportLoad&&g===generation)ui.reportError=e.message;}
  if(n===reportLoad&&g===generation){ui.reportBusy=false;node=$('#report-rows');if(node)node.innerHTML=reportHTML();}
}
let typingAt=0,typingTimer=0;
function writeDraft(input){
  const t=currentThread();if(!t)return;

async function submitModal(form, act, data, done){
  if(form.dataset.busy)return;
  form.dataset.busy='1';const g=generation,btn=form.querySelector('button[type=submit]');btn.disabled=true;
  try{const r=await operate(act,data);if(g!==generation)return;await refresh();if(g!==generation)return;if(form===modal.querySelector('form'))closeModal();done?.(r);}
  catch(error){if(g!==generation)return;if(error.code===401){closeSession('Sesja wygasła.');return;}if(form.isConnected)dialogError(error.message);else toast(error.message,true);}
  finally{btn.disabled=false;delete form.dataset.busy;}
}
function submit(event){
  event.preventDefault();const form=event.target;
  if(form.id==='auth-form')return loginSubmit(form);
  if(form.id==='recovery-confirm')return confirmRecovery();
  if(form.id==='account-security-form')return beginAccountCredentialChange(form,false);
  if(form.id==='account-recovery-form')return beginAccountCredentialChange(form,true);
  if(form.id==='composer')return send();
  const data=new FormData(form),fields=Object.fromEntries(data),d=ui.modal;
  switch(form.id){
    case 'profile-form':{
      if(form.dataset.busy)return;
      const patch=Object.fromEntries(Object.entries(ui.profileEdit).filter(([k,v])=>v!==ui.profileBase[k]));
      if(!Object.keys(patch).length)return;
      const g=generation;form.dataset.busy='1';
      const locked=$$('input,textarea,select,button',form).filter(x=>!x.disabled);for(const el of locked)el.disabled=true;
      (async()=>{try{
        await operate('profile',patch);await refresh();if(g!==generation)return;
        profileEditor(true);if(Object.hasOwn(patch,'status'))awayAutomatic=false;
        if(form.isConnected)renderMain();toast('Zapisano profil.');
      }catch(e){if(g!==generation)return;if(e.code===401){closeSession('Sesja wygasła.');return;}const er=form.querySelector('#profile-error');if(er&&form.isConnected){er.textContent=e.message;er.hidden=false;}else toast(e.message,true);}
      finally{delete form.dataset.busy;if(form.isConnected){for(const el of locked)el.disabled=false;$('#profile-save').disabled=!profileDirty();}}})();break;
    }
    case 'group-form':if(d?.type==='picker'&&!d.loading)submitModal(form,d.group?'group.edit':'group.create',{id:d.group,name:fields.name,photo:d.photo,members:d.selected},r=>{selectChat(r.id,true,true);toast(d.group?'Zapisano grupę.':'Utworzono grupę.');});break;
    case 'server-form':if(d&&!d.loading)submitModal(form,d.id?'server.edit':'server.create',{sid:d.id,name:fields.name,description:fields.description,photo:d.data.photo},r=>selectServer(r.sid,d.id?null:r.channel,true));break;
    case 'join-form':submitModal(form,'server.join',{code:fields.code},r=>selectServer(r.sid,null,true));break;
    case 'channel-form':submitModal(form,d.channel?'channel.edit':'channel.create',{sid:d.sid,channel:d.channel,...fields,limit:Number(fields.limit||0)},r=>selectServer(r.sid,r.id));break;
    case 'server-event-form':{
      const startsAt=new Date(fields.startsAt).getTime();if(!Number.isFinite(startsAt))return dialogError('Podaj termin wydarzenia.');
      const sid=d.sid;submitModal(form,d.id?'server.event.edit':'server.event.create',{sid,id:d.id,startsAt,title:fields.title,description:fields.description},()=>openModal({type:'server-events',sid}));break;
    }
    case 'dm-folder-form':{
      const name=String(fields.name||'').trim(),items=folderState();if(!name)return dialogError('Podaj nazwę folderu.');if(!d.edit&&items.length>=24)return dialogError('Możesz zapisać do 24 folderów.');
      if(items.some(f=>f.id!==d.edit&&f.name.toLocaleLowerCase('pl')===name.toLocaleLowerCase('pl')))return dialogError('Taki folder już istnieje.');
      const path=d.path;
      saveFolders(d.edit?items.map(f=>f.id===d.edit?{...f,name}:f):[...items,{id:crypto.randomUUID(),name,paths:path?[path]:[]}]);openModal({type:'dm-folders',path});break;
    }
    case 'category-form':submitModal(form,'server.category',{sid:d.sid,name:fields.name},()=>renderMain());break;
    case 'edit-form':if(!fields.body.trim()&&!d.hasAttachment)return dialogError('Wiadomość nie może być pusta.');submitModal(form,'edit',{id:d.id,path:d.path,...BlobDecode.pack(fields.body.trim())},()=>toast('Zapisano zmiany wiadomości.'));break;
    case 'poll-form':{
      const endsAt=new Date(fields.endsAt).getTime();if(!Number.isFinite(endsAt))return dialogError('Podaj czas zakończenia.');
      submitModal(form,'poll.create',{path:d.path,question:fields.question,options:data.getAll('option').map(o=>o.trim()).filter(Boolean),multiple:!!fields.multiple,endsAt},()=>scrollConversation(true));break;
    }
    case 'report-form':{
      const score=Number(fields.score)||null;
      submitModal(form,'report.submit',{type:d.kind,id:d.id,path:d.path,text:fields.reason.trim(),score},()=>{toast(score?'Wysłano opinię.':'Zapisano zgłoszenie w TYPHON.');if(ui.setting==='reports')loadReports(false);});break;
    }
  }
}

      if(!await requestNotificationGrant()){i.checked=original;const label=$('#notification-permission');if(label)label.textContent=notificationPermissionText();toast('Przeglądarka nie zezwoliła na powiadomienia systemowe.',true);return;}
    }
    if(Object.hasOwn(localNoticeDefaults,k)){setLocalNotices(db.profile.uid,{[k]:value});db.settings={...db.settings,[k]:value};if(k==='notifSysEnabled'&&$('#notification-permission'))$('#notification-permission').textContent=notificationPermissionText();return;}
    const hiddenStatusKey='reef.private.presence.'+db.profile.uid;
    if(k==='lastSeenEnabled'&&value===false)saveLocal(hiddenStatusKey,db.profile.status||'online');
    const rememberedStatus=k==='lastSeenEnabled'&&value===true?readLocal(hiddenStatusKey,'online'):null;
    const result=await change('settings',{settings:{[k]:value}});
    if(result&&k==='saveDrafts')updateDraftPersistence(value);
    if(result&&k==='lastSeenEnabled'&&value===true){
      const status=['online','away','dnd','offline'].includes(rememberedStatus)?rememberedStatus:'online';
      const restored=await change('profile',{status});
      if(restored)saveLocal(hiddenStatusKey,null);
    }
    if(!result&&k==='lastSeenEnabled'&&value===false)saveLocal(hiddenStatusKey,null);
    if(!result&&i.isConnected){if(i.type==='checkbox')i.checked=original;else{i.value=String(original);syncPickerLabel(i);}}
  }
});
document.addEventListener('keydown',event=>{
  if(event.isComposing)return;
  const i=event.target;
  if(db.profile)activity();
  if(event.key==='Escape'){
    const picker=document.querySelector('.reef-picker.open');
    if(picker){event.preventDefault();picker.classList.remove('open');picker.querySelector('.reef-picker-trigger')?.setAttribute('aria-expanded','false');const m=picker.querySelector('.reef-picker-menu');if(m){m.style.top='';m.style.left='';m.style.width='';}picker.querySelector('.reef-picker-trigger')?.focus({preventScroll:true});}
    else if(ui.pop){event.preventDefault();closePop(true);}
    else if(!modal.open&&$('#findbar')&&!$('#findbar').hidden){event.preventDefault();hideFind();}
    else if(!modal.open&&i.type==='search'&&i.value){i.value='';i.dispatchEvent(new Event('input',{bubbles:true}));}return;
  }
  if(ui.pop&&['ArrowDown','ArrowUp','Home','End','ArrowLeft','ArrowRight'].includes(event.key)){
    const controls=$$('button',popRoot), pos=controls.indexOf(i);if(pos>=0){event.preventDefault();const step=['ArrowDown','ArrowRight'].includes(event.key)?1:-1;controls[event.key==='Home'?0:event.key==='End'?controls.length-1:(pos+step+controls.length)%controls.length]?.focus();return;}
  }
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'&&db.profile){
    event.preventDefault();if(ui.modal?.type==='switch')closeModal();else if(!modal.open){closePop();openModal({type:'switch',query:''});$('#switch-query')?.focus();}return;
  }
  if(ui.modal?.type==='switch'){
    const list=$$('#switch-results button'),pos=list.indexOf(i);if(['ArrowDown','ArrowUp'].includes(event.key)&&(pos>=0||i.id==='switch-query')&&list.length){event.preventDefault();const next=event.key==='ArrowDown'?pos+1:pos<0?list.length-1:pos-1;(next<0?$('#switch-query'):list[next%list.length])?.focus();return;}
    if(event.key==='Enter'&&i.id==='switch-query'&&list.length){event.preventDefault();list[0].click();return;}
  }
  if(event.altKey&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&event.key.toLowerCase()==='m'&&ui.view==='chats'&&currentThread()&&!modal.open){event.preventDefault();$('#message-input')?.focus();return;}
  if(event.altKey&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&['ArrowLeft','ArrowRight'].includes(event.key)&&ui.view==='chats'&&!modal.open&&!ui.pop){
    const direct=db.chats.filter(c=>c.type==='direct').sort((a,b)=>(lastMessage(b)?.at||b.created)-(lastMessage(a)?.at||a.created));
    const index=direct.findIndex(c=>c.id===ui.chat);if(index>=0&&direct.length>1){event.preventDefault();const step=event.key==='ArrowRight'?1:-1;selectChat(direct[(index+step+direct.length)%direct.length].id,true,true);return;}
  }
  if(event.key==='Enter'&&i.id==='message-input'&&!event.shiftKey&&!event.altKey&&!event.isComposing&&db.settings.enterToSend!==false){
    event.preventDefault();send();
  }
  if(event.key==='Enter'&&i.id==='message-query'&&ui.threadSearch){event.preventDefault();ui.threadSearch.index+=event.shiftKey?-1:1;updateMatches();}
});
mediaQuery.addEventListener('change',applyTheme);
window.addEventListener('resize',()=>{closePop();fitComposer();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token&&db.profile){refresh();queueRead();}});
window.addEventListener('online',()=>{if(token&&db.profile){refresh();loopSync();}});
setInterval(()=>{
  const minutes=db.settings.awayMinutes;
  if(db.profile?.status==='online'&&minutes&&!settingAuto&&!RTC.stream&&Date.now()-activityAt>=minutes*60_000){
    settingAuto=true;change('profile',{status:'away'}).then(r=>{awayAutomatic=!!r;}).finally(()=>settingAuto=false);
  }
},30_000);
renderAuth();
bootLocal();
